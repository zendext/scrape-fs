name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish linux/amd64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Verify repository
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go -C desktop test -race ./internal/gui
          go -C desktop vet ./internal/gui
          test -z "$(gofmt -l .)"
          sh -n \
            scripts/install.sh \
            scripts/build-desktop.sh \
            scripts/install-desktop.sh \
            scripts/package-release.sh \
            scripts/release-version.sh
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*.py'
          python3 -m unittest discover \
            -s skills/organize-scrapefs-media/tests \
            -p 'test_*.py'

      - name: Package release
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "$VERSION" dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_kind=$(
            ./scripts/release-version.sh "$GITHUB_REF_NAME"
          )
          case "$release_kind" in
            prerelease)
              set -- --prerelease --latest=false
              ;;
            stable)
              set --
              ;;
            *)
              printf 'unexpected release kind: %s\n' "$release_kind" >&2
              exit 1
              ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "$@"
